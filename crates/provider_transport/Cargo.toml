[package]
name = "provider_transport"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
[dependencies]
async-trait = "0.1.92"
tokio = { version = "1.53.1", features = ["rt", "macros"] }
# Both already present in the workspace Cargo.lock (reqwest 0.13.5,
# serde_json 1.0.151); no new transitive dependency is introduced. Required to
# reach a real loopback inference boundary per PROVIDER_TRANSPORT_MATRIX.md
# instead of fabricating model output (anti-gaming finding AG-001).
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
serde_json = "1.0.151"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["rt", "macros", "rt-multi-thread"] }
