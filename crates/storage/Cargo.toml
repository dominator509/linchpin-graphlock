[package]
name = "storage"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
# `backup` enables the online-backup API used by REQ-REL-005 ("backup/restart/
# recovery ... executed against reconciled persistent state"). A file copy is not
# a backup: it can capture a torn WAL state. Same crate, same pinned version.
rusqlite = { version = "0.40.2", features = ["bundled", "backup"] }
tantivy = "0.26.2"
# `v7` is enabled because REQ-DATA-001 requires UUIDv7 identifiers for the
# canonical tables -- time-ordered ids that index better than v4 and sort by
# creation. Same crate, same locked version; only a feature is added.
uuid = { version = "1.26.0", features = ["v4", "v7"] }
# Already in the workspace Cargo.lock (sha2 0.10.9). Required by REQ-DATA-002:
# "Evidence blobs are content-addressed SHA-256". No new transitive package.
sha2 = "0.10.9"
