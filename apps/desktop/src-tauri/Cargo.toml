[package]
name = "linchpin-desktop"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
[lib]
name = "linchpin_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.0", features = [] }

[dependencies]
tauri = { version = "2.6.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Already in the workspace Cargo.lock (uuid 1.26.0, via domain). Needed for
# correlation IDs (SPEC-003) and domain entity construction. No new package.
uuid = { version = "1.26.0", features = ["v4", "serde"] }
domain = { path = "../../../crates/domain" }
application = { path = "../../../crates/application" }
storage = { path = "../../../crates/storage" }
evidence = { path = "../../../crates/evidence" }
research = { path = "../../../crates/research" }
patent = { path = "../../../crates/patent" }
commercialization = { path = "../../../crates/commercialization" }
provider_transport = { path = "../../../crates/provider_transport" }
mcp_hub = { path = "../../../crates/mcp_hub" }
crash_reporter = { path = "../../../crates/crash_reporter" }
platform_windows = { path = "../../../crates/platform_windows" }
